name: "Godot 4.4 Web Deploy"
on:
  push:
    branches:
      - main # Change this if your branch is named 'master'

permissions:
  contents: write

jobs:
  export_web:
    runs-on: ubuntu-latest
    name: Export and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot 4.4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.0 # Specifically using 4.4.0
          use-dotnet: false # Set to false since you use GDScript

      - name: Web Export
        run: |
          mkdir -v -p build/web
          # "Web" must match the name of your Export Preset in Godot
          godot --headless --export-release "Web" build/web/index.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages